<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字图书展销平台</title>
    <!-- 路径要和你文件夹结构对应 -->
    <link rel="stylesheet" href="css/lab4-02-006-index.css">
</head>
<body>
    <div class="header">
        <div class="logo">数字图书展销平台</div>
        <div class="nav">
            <a href="#">首页</a>
            <a href="#">产品展示</a>
            <a href="#">图书分类</a>
            <a href="#">新品上市</a>
            <a href="#">关于我们</a>
            <a href="#">联系我们</a>
            <a href="#" class="icon" style="font-size:18px; margin-left:22px;">🔍</a>
            <a href="javascript:openCart()" class="icon" style="font-size:18px; margin-left:12px;">🛒</a>
            <a class="top-btn" href="javascript:openLogin()">登录</a>
            <a class="top-btn" href="javascript:openReg()">注册</a>
        </div>
    </div>

    <div class="carousel">
        <div class="carousel-inner">
            <img src="images/book1.jpg">
            <img src="images/book2.jpg">
            <img src="images/book3.jpg">
        </div>
    </div>

    <div class="cart-box" id="cartBox">
        <h3>我的购物车</h3>
        <div id="cartList">购物车为空</div>
        <button class="close-cart" onclick="closeCart()">关闭</button>
    </div>

    <div class="container">
        <div class="left-col">
            <h3>图书分类</h3>
            <ul class="category-list">
                <li><a href="#">教育</a></li>
                <li><a href="#">儿童</a></li>
                <li><a href="#">史实</a></li>
                <li><a href="#">科幻</a></li>
            </ul>
        </div>

        <div class="middle-col">
            <div class="hot-recommend">
                <h3>热门推荐</h3>
                <div class="book-grid">
                    <div class="book-item" onclick="addToCart('百年孤独',48)">
                        <img src="images/book1.jpg" alt="百年孤独">
                        <p>百年孤独</p>
                        <span>¥48</span>
                    </div>
                    <div class="book-item" onclick="addToCart('我与地坛',45)">
                        <img src="images/book2.jpg" alt="我与地坛">
                        <p>我与地坛</p>
                        <span>¥45</span>
                    </div>
                    <div class="book-item" onclick="addToCart('围城',37)">
                        <img src="images/book3.jpg" alt="围城">
                        <p>围城</p>
                        <span>¥37</span>
                    </div>
                    <div class="book-item" onclick="addToCart('你当像鸟飞往你的山',36)">
                        <img src="images/book4.jpg" alt="你当像鸟飞往你的山">
                        <p>你当像鸟飞往你的山</p>
                        <span>¥36</span>
                    </div>
                </div>
            </div>

            <div class="new-books">
                <h3>新书上市</h3>
                <table>
                    <tr>
                        <th>书名</th>
                        <th>作者</th>
                        <th>价格</th>
                    </tr>
                    <tr>
                        <td>Linux应用与实训教程</td>
                        <td>刘飞</td>
                        <td>¥36.66</td>
                    </tr>
                    <tr>
                        <td>C程序设计</td>
                        <td>谭浩强</td>
                        <td>¥66.66</td>
                    </tr>
                    <tr>
                        <td>大学军事教程</td>
                        <td>柳炳祥</td>
                        <td>¥88.88</td>
                    </tr>
                    <tr>
                        <td>程序设计基础</td>
                        <td>张小峰</td>
                        <td>¥99.99</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="right-col">
            <div class="promo-card">
                <img src="images/promo1.png" alt="满减活动">
                <p>全场图书满66.66减20！</p>
            </div>
            <div class="promo-card">
                <img src="images/promo2.png" alt="第二件半价">
                <p>购买C程序设计享第二件半价！</p>
            </div>
            <div class="promo-card">
                <img src="images/promo3.png" alt="会员优惠">
                <p>会员专享额外9折优惠！</p>
            </div>
        </div>
    </div>

    <div class="login-box" id="loginModal">
        <h4>用户登录</h4>
        <input type="text" id="loginUser" placeholder="用户名">
        <input type="password" id="loginPwd" placeholder="密码">
        <button onclick="loginCheck()">登录</button>
        <button onclick="closeBox()">关闭</button>
    </div>

    <div class="login-box" id="regModal">
        <h4>用户注册</h4>
        <input type="text" id="regUser" placeholder="设置用户名">
        <input type="password" id="regPwd" placeholder="设置密码">
        <button onclick="registerSave()">注册</button>
        <button onclick="closeBox()">关闭</button>
    </div>

<script>
function openLogin(){document.getElementById("loginModal").style.display="block";document.getElementById("regModal").style.display="none";}
function openReg(){document.getElementById("regModal").style.display="block";document.getElementById("loginModal").style.display="none";}
function closeBox(){document.getElementById("loginModal").style.display="none";document.getElementById("regModal").style.display="none";}
function registerSave(){let u=document.getElementById("regUser").value.trim();let p=document.getElementById("regPwd").value.trim();if(!u||!p){alert("请填写完整信息");return;}localStorage.setItem("userData",JSON.stringify({name:u,pwd:p}));alert("注册成功！");closeBox();}
function loginCheck(){let u=document.getElementById("loginUser").value.trim();let p=document.getElementById("loginPwd").value.trim();let local=localStorage.getItem("userData");if(!local){alert("请先注册");return;}let user=JSON.parse(local);if(u==user.name&&p==user.pwd){alert("登录成功！");closeBox();}else{alert("账号或密码错误");}}
let cart=[];
function openCart(){document.getElementById("cartBox").style.display="block";renderCart();}
function closeCart(){document.getElementById("cartBox").style.display="none";}
function addToCart(name,price){cart.push({name,price});alert(name+" 已加入购物车");}
function renderCart(){let list=document.getElementById("cartList");if(cart.length===0){list.innerHTML="购物车为空";return;}let html="";let total=0;cart.forEach(item=>{html+=`<div class='cart-item'>${item.name} - ¥${item.price}</div>`;total+=item.price;});html+=`<div style='margin-top:10px;font-weight:bold;'>总计：¥${total}</div>`;list.innerHTML=html;}
</script>
</body>
</html>
