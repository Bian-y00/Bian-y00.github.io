<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>数字展销平台</title>
    <link rel="stylesheet" href="lab2-02-006-index.css">
</head>
<body>
    <div class="header">
        <div class="logo">数字展销平台</div>
        <div class="nav">
            <a href="#">首页</a>

            <a href="#">图书分类</a>

    </div>

    <div class="container">
        <div class="left-col">
            <h3>图书分类</h3>
            <ul class="category-list">
                <li><a href="#">教育</a></li>
                <li><a href="#">儿童</a></li>
                <li><a href="#">史实</a></li>
                <li><a href="#">科幻</a></li>
            </ul>
        </div>

        <div class="middle-col">
            <div class="hot-recommend">
                <h3>热门推荐</h3>
                <div class="book-grid">
                    <div class="book-item">
                        <img src="images/book1.jpg" alt="百年孤独">

                    <div class="book-item">
                        <img src="images/book2.jpg" alt="我与地坛">

                        <span>¥45</span>
                    </div>
                    <div class="book-item">
                        <img src="images/book3.jpg" alt="围城">
                        <p>围城</p>
                        <span>¥37</span>
                    </div>
                    <div class="book-item">
                        <img src="images/book4.jpg" alt="你当像鸟飞往你的山">
                        <p>你当像鸟飞往你的山</p>
                        <span>¥36</span>
                    </div>
                </div>
            </div>

            <div class="new-books">
                <h3>新书上市</h3>
                <table>
                    <tr>
                        <th>书名</th>
                        <th>作者</th>
                        <th>价格</th>
                    </tr>
                    <tr>
                        <td>Linux应用与实训教程</td>
                        <td>刘飞</td>
                        <td>¥36.66</td>
                    </tr>
                    <tr>
                        <td>C程序设计</td>

                        <td>¥66.66</td>
                    </tr>
                    <tr>
                        <td>大学军事教程</td>
                        <td>柳炳祥</td>
                        <td>¥88.88</td>
                    </tr>
                    <tr>
                        <td>程序设计基础</td>
                        <td>张小峰</td>
                        <td>¥99.99</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="right-col">
            <div class="promo-item">
                <img src="images/promo1.png" alt="满减活动">
                <p>全场图书满66.66减20！</p>
            </div>
            <div class="promo-item">
                <img src="images/promo2.png" alt="第二件半价">
                <p>购买C程序设计享第二件半价！</p>
            </div>
            <div class="promo-item">
                <img src="images/promo3.png" alt="会员优惠">
                <p>会员专享额外9折优惠！</p>
            </div>
